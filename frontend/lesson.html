<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UpToSkill · Classroom</title><link rel="icon" href="assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/money.css">
<style>
 main.room{max-width:none;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;height:calc(100vh - 58px);flex-direction:row}
 #stage{border-radius:14px;overflow:hidden;background:#0B1226;min-height:360px}#stage iframe{width:100%;height:100%;border:0;display:block}
 aside.panel{display:flex;flex-direction:column;gap:12px;overflow:auto}
 .timer{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
 .rec{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600}.dot{width:10px;height:10px;border-radius:50%;background:#B91C1C;animation:p 1.4s infinite}@keyframes p{50%{opacity:.25}}
 pre{white-space:pre-wrap;font:14px/1.5 Inter,sans-serif;margin:0}
 @media(max-width:860px){main.room{grid-template-columns:1fr;height:auto}#stage{height:70vh}}
</style></head>
<body>
<header class="top"><img src="assets/logo.png" alt="UpToSkill"><nav><a href="wallet.html">Wallet</a><a href="lessons.html">Lessons</a></nav><button class="link" id="out">Sign out</button></header>
<main id="app"></main><div id="toast"></div>
<script src="shared/config.js"></script><script src="shared/api.js"></script><script src="lesson.js"></script>
</body></html>
