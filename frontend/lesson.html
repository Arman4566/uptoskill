<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classroom · UpToSkill</title><link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="lessons.css"></head>
<body data-back-fallback="lessons.html">
<header class="bar"><span style="width:90px"></span><b>UpToSkill classroom</b></header>
<main id="app"><p class="mut">Loading...</p></main>
<script src="virtual-room-config.js"></script>
<script src="api.js"></script><script src="shared/back.js"></script>
<script>
/* Placeholder classroom: shows the lesson and lets the tutor start / finish it (this moves the credits).
   The video room, screen sharing and recording are not part of the files supplied, so they are not here yet. */
(function () {
  const { api, boot, esc, when, toast } = UTSApi;
  const id = Number(new URLSearchParams(location.search).get("session"));
  boot(async me => {
    const draw = async () => {
      let s; try { s = await api("/sessions/" + id); } catch (e) { document.getElementById("app").innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
      const tutor = s.mentor_id === me.id;
      document.getElementById("app").innerHTML = `<section class="card pad"><h1>${esc(s.title)}</h1>
        <div class="chips"><span class="chip">${s.minutes} min</span><span class="chip">${esc(s.status)}</span></div>
        <p>${esc(s.problem_text)}</p><p class="mut">Booked ${when(s.created_at)}</p>
        <div class="row">${tutor && s.status === "accepted" ? `<button class="btn orange" data-a="start">Start lesson</button>` : ""}
        ${tutor && s.status === "in_progress" ? `<button class="btn orange" data-a="complete">Finish lesson</button>` : ""}
        <a class="btn ghost" href="lessons.html">All lessons</a></div>
        <p class="mut">The live video room is not included in this build yet.</p></section>`;
      document.querySelectorAll("[data-a]").forEach(b => b.onclick = async () => { try { await api(`/sessions/${id}/${b.dataset.a}`, { method: "POST" }); toast("Done."); } catch (e) { toast(e.message); } draw(); });
    };
    draw();
  });
})();
</script></body></html>
